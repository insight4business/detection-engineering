# Example validation workflow for GitHub Actions (generic, with placeholders).
# Copy to .github/workflows/validate-detections.yml and adapt paths. Does not imply a workflow exists in any environment.
name: validate-detections

on:
  pull_request:
    paths:
      - "02-detection-engineering/**"
  push:
    branches: [main]
    paths:
      - "02-detection-engineering/**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Validate YAML and lint rule headers
        run: python 02-detection-engineering/use-case-management/detection-as-code/pipelines/lint_rules.py 02-detection-engineering

      - name: Repository sanitization gate
        run: python3 -I tools/sanitize.py
